---
- name: Configure macOS development environment
  hosts: all

  pre_tasks:
    - name: Include playbook configuration.
      include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
        - "{{ playbook_dir }}/ansible-private-config.yml"
      tags: ['always']

  tasks:
    - name: Configure Oh My Zsh
      import_tasks: tasks/ohmyzsh.yml
      tags: ['zsh']

    - name: Configure Python environment
      import_tasks: tasks/python.yml
      tags:
        - python

    - name: Configure NPM environment
      import_tasks: tasks/npm.yml
      tags: ['npm']

    - name: Configure Java environment with jenv
      import_tasks: tasks/jenv.yml
      tags: ['java', 'android', 'flutter']

    # - import_tasks: tasks/aws.yml
    #  tags: ['aws']

    - name: Configure Android development environment
      import_tasks: tasks/android.yml
      tags: ['android', 'flutter']

    - name: Configure Flutter development environment
      import_tasks: tasks/flutter.yml
      tags: ['flutter']

    # - import_tasks: tasks/one_password.yml

    - name: Configure macOS Dock
      import_tasks: tasks/dock.yml
      tags: ['osx']

    - name: Configure Time Machine settings
      import_tasks: tasks/time-machine.yml
      tags: ['osx']

    - name: Configure macOS Spotlight exclusions
      import_tasks: tasks/osx-spotlight.yml
      tags: ['osx-spotlight']

    # - name: Install Vundle
    #  git:
    #    repo: https://github.com/VundleVim/Vundle.vim.git
    #    version: master
    #    dest: ~/.vim/bundle/Vundle.vim
    #    depth: 1
    #  tags: ['dotfiles']

    # - name: Install Vundle Plugins
    #  command: vim +PluginInstall +qall
    #  changed_when: false
    #  tags: ['dotfiles']

    # - name: Run .osx dotfiles.
    #  shell: ~/.osx --no-restart
    #  changed_when: false
    #  tags: ['osx']

    - name: Configure SSH settings
      import_tasks: tasks/ssh.yml
      tags: ['ssh', 'repos']

    - name: Configure Git repositories
      import_tasks: tasks/git-repos.yml
      tags: ['repos']

    - name: Configure Go development environment
      import_tasks: tasks/go.yml
      tags: ['go']

    - name: Configure crontab entries
      import_tasks: tasks/crontab.yml
      tags: ['crontab']

  handlers:
    - name: Clear homebrew cache
      file:
        path: "{{ homebrew_cache_path.stdout | trim }}"
        state: absent
      when: 'homebrew_clear_cache | bool'
      become: "{{ (homebrew_user != ansible_user_id) | bool }}"
      become_user: "{{ homebrew_user }}"

    - name: Restart espanso
      command: espanso restart
      changed_when: false

  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']
